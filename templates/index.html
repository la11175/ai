<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式練習介面</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>AI 程式練習助手</h1>
        <p>這是一個用於練習程式設計的 AI 助手。請選擇學習主題，然後點擊「幫我出題」按鈕，AI 將會為您生成一個練習題目。</p>
        
        <!-- 第一個表單：選擇學習主題並出題 -->
        <h3>請輸入選擇的學習主題：</h3>
        <form method="post">
            <div class="topics">
                <label class="option-label">
                    <input type="radio" name="topic" value="輸入輸出" {% if topic == "輸入輸出" %}checked{% endif %}> 輸入輸出
                </label>
                <label class="option-label">
                    <input type="radio" name="topic" value="條件判斷" {% if topic == "條件判斷" %}checked{% endif %}> 條件判斷
                </label>
                <label class="option-label">
                    <input type="radio" name="topic" value="迴圈" {% if topic == "迴圈" %}checked{% endif %}> 迴圈
                </label>
                <label class="option-label">
                    <input type="radio" name="topic" value="串列" {% if topic == "串列" %}checked{% endif %}> 串列
                </label>
            </div>
            <!-- 出題按鈕 -->
            <button type="submit" class="btn" name="action" value="generate">幫我出題</button>
        </form>

        {% if topic %}
        <p style="margin-top: 15px; color: #555;">目前選擇的主題：{{ topic }}</p>
        {% endif %}

        <!-- AI 出題與作答區塊 -->
        <div class="card">
            <h3>AI 出題：</h3>
            <p>{{ question_text }}</p>

            <!-- 只有當後端有傳入 question_data（AI 題目）時才顯示選項與提交按鈕 -->
            {% if question_data %}
            <form method="POST">
                <!-- 隱藏欄位，提交時保留目前的學習主題 -->
                <input type="hidden" name="topic" value="{{ topic }}">
                
                <div style="margin: 15px 0;">
                    <!-- 顯示 Gemini AI 產生的四個選項內容 -->
                    <label class="option-label" style="display: block; margin-bottom: 8px;">
                        <input type="radio" name="student_answer" value="A"> A. {{ question_data["A"] }}
                    </label>
                    <label class="option-label" style="display: block; margin-bottom: 8px;">
                        <input type="radio" name="student_answer" value="B"> B. {{ question_data["B"] }}
                    </label>
                    <label class="option-label" style="display: block; margin-bottom: 8px;">
                        <input type="radio" name="student_answer" value="C"> C. {{ question_data["C"] }}
                    </label>
                    <label class="option-label" style="display: block; margin-bottom: 8px;">
                        <input type="radio" name="student_answer" value="D"> D. {{ question_data["D"] }}
                    </label>
                </div>

                <!-- 提交答案按鈕 -->
                <button type="submit" class="btn" name="action" value="check">提交答案</button>
            </form>
            {% endif %}
        </div>

        <!-- 顯示 AI 回饋結果 -->
        <div class="card">
            <h3>AI 回饋：</h3>
            <p>{% if feedback %}{{ feedback }}{% else %}尚無回饋{% endif %}</p>
        </div>
    </div>
</body>
</html>
